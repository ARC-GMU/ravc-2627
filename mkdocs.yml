site_name: RAVC 2627
site_description: Engineering docs for RAVC 2627
site_url: https://arc-gmu.github.io/ravc-2627/
repo_url: https://github.com/ARC-GMU/ravc-2627
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/arc_dark.png
  favicon: assets/logooo_circlebg.png
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://gmu.autonomousrobotics.club/
      name: Autonomous Robotics Club at GMU
    - icon: fontawesome/brands/discord
      link: https://discord.gg/zn93yRNZGb
      name: Discord

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Project:
      - Overview: project/overview.md
      - Competition rules: project/rules.md
      - Team & roles: project/team.md
      - How we work: project/workflow.md
      - Milestones: project/milestones.md
  - Hardware:
      - Overview: hardware/index.md
      - Bill of materials: hardware/bom.md
  - Software:
      - Overview: software/index.md
      - Dev environment: software/dev-environment.md
